ktor {
    development = true
    development = ${?KTOR_DEVELOPMENT}
    deployment {
        port = 7730
        port = ${?PORT}
    }
    application {
        modules = [ com.cristianllanos.calendarengine.ApplicationKt.module ]
    }
}

database {
    url = "jdbc:mysql://localhost:7706/calendar_engine"
    url = ${?DB_URL}
    driver = "com.mysql.cj.jdbc.Driver"
    user = "calendar_engine"
    user = ${?DB_USER}
    password = "calendar_engine"
    password = ${?DB_PASSWORD}
}

sync {
    google {
        enabled = false
        enabled = ${?SYNC_GOOGLE_ENABLED}
        clientId = ""
        clientId = ${?GOOGLE_CLIENT_ID}
        clientSecret = ""
        clientSecret = ${?GOOGLE_CLIENT_SECRET}
        webhookBaseUrl = ""
        webhookBaseUrl = ${?GOOGLE_WEBHOOK_BASE_URL}
    }
    apple {
        enabled = false
        enabled = ${?SYNC_APPLE_ENABLED}
    }
    mode = "ON_DEMAND"
    mode = ${?SYNC_MODE}
    pollingIntervalMinutes = 15
    pollingIntervalMinutes = ${?SYNC_POLLING_INTERVAL}
}

events {
    emitter = "TABLE"
    emitter = ${?EVENT_EMITTER}
    webhookUrl = ""
    webhookUrl = ${?EVENT_WEBHOOK_URL}
}
